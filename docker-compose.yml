# Garage Management System — single-server deployment.
#   cp .env.example .env   (or: ./scripts/init-env.sh)   then edit .env
#   docker compose up -d
name: gms

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-gms}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  backend:
    build: ./backend
    image: gms-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      UPLOAD_DIR: /data/uploads
      COOKIE_SECURE: ${COOKIE_SECURE:-${ENABLE_HTTPS:-false}}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  web:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: gms-web:latest
    restart: unless-stopped
    environment:
      ENABLE_HTTPS: ${ENABLE_HTTPS:-false}
      DOMAIN: ${DOMAIN:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - backend
    logging: *logging

  # Obtains and renews the Let's Encrypt certificate (idle when ENABLE_HTTPS=false).
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/certbot.sh"]
    environment:
      ENABLE_HTTPS: ${ENABLE_HTTPS:-false}
      DOMAIN: ${DOMAIN:-}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
      LETSENCRYPT_STAGING: ${LETSENCRYPT_STAGING:-false}
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
      - ./scripts/certbot.sh:/scripts/certbot.sh:ro
    logging: *logging

  # Daily database + uploads backup into BACKUP_DIR on the host.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/backup-loop.sh"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-gms}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-gms}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      TZ: ${TZ:-Asia/Colombo}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - uploads:/uploads:ro
      - ./scripts/backup-loop.sh:/scripts/backup-loop.sh:ro
      - ./scripts/backup-once.sh:/scripts/backup-once.sh:ro
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

volumes:
  pgdata:
  uploads:
  letsencrypt:
  certbot-www:
